name: Python package

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e .[tests]
      - name: Run pytest
        run: pytest

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e .[tests]
      - name: Run pytest coverage
        run: pytest --cov=src

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e .[tests]
      - name: Run ruff
        run: ruff check src

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install build tools
        run: |
          python -m pip install -U pip
          python -m pip install build twine
      - name: Build package
        run: python -m build
      - name: Check package
        run: twine check dist/*
      - name: Test installed certificate resources
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl pytest "cryptography >= 42"
          python -I -m pytest "$GITHUB_WORKSPACE/tests/test_environments.py" --import-mode=importlib
