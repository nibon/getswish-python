name: Python package

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
      - name: Install package
        run: uv sync --locked
      - name: Run pytest
        run: uv run --locked pytest

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.15"
      - name: Install package
        run: uv sync --locked
      - name: Run pytest coverage
        run: uv run --locked pytest --cov=src

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.15"
      - name: Install package
        run: uv sync --locked
      - name: Run ruff
        run: uv run --locked ruff check src

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.10"
      - name: Install package
        run: uv sync --locked
      - name: Run ty
        run: uv run --locked ty check src

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.15"
      - name: Install development tools
        run: uv sync --locked
      - name: Build package
        run: uv build
      - name: Check package
        run: uv run --locked twine check dist/getswish-*.whl dist/getswish-*.tar.gz
      - name: Test installed certificate resources from wheel and sdist
        working-directory: ${{ runner.temp }}
        run: |
          for artifact in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            environment="$(mktemp -d "$RUNNER_TEMP/getswish-install-XXXXXX")"
            uv venv --python 3.15 "$environment"
            uv pip install --python "$environment/bin/python" "$artifact" pytest 'cryptography >= 42'
            "$environment/bin/python" -I -m pytest "$GITHUB_WORKSPACE/tests/test_environments.py" --import-mode=importlib
          done
