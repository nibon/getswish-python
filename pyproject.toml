[project]
name = "getswish"
version = "0.4.1"
description = "Getswish python client library"
authors = [{ name = "Daniel Nibon", email = "daniel@nibon.se" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["swish", "getswish", "payment", "payout"]
requires-python = ">=3.10"
dependencies = [
    "requests >= 2.27",
    "rsa >= 4.7.2",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Source = "https://github.com/nibon/getswish-python"

[dependency-groups]
dev = [
    "pytest >= 7",
    "pytest-mock",
    "pytest-cov >= 4",
    "cryptography >= 42",
    "ruff",
    "twine",
    "ty",
]

[build-system]
requires = ["uv_build >=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**", "CHANGELOG.md"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff.lint]
select = ["E", "F"]
exclude = ["venv", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
